version: "3.9"

# Requiere que innovatech-frontend esté clonado como carpeta hermana de este repo:
#
#   proyectos/
#     innovatech-backend/    <- este repo (contiene este docker-compose.yml)
#     innovatech-frontend/
#
# Copia .env.example a .env y ajusta las credenciales antes de levantar.

services:

  mysql:
    image: mysql:8.0
    container_name: innovatech-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-innovatech_db}
      MYSQL_USER: ${DB_USERNAME:-innovatech}
      MYSQL_PASSWORD: ${DB_PASSWORD:-innovatech123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - innovatech-net

  ventas:
    build:
      context: ./back-Ventas_SpringBoot
      dockerfile: ../Dockerfile
    container_name: innovatech-ventas
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_ENDPOINT: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-innovatech_db}
      DB_USERNAME: ${DB_USERNAME:-innovatech}
      DB_PASSWORD: ${DB_PASSWORD:-innovatech123}
      # El application.properties de Ventas no fija server.port (default 8080 de Spring Boot),
      # pero en AWS el Task Definition inyecta SERVER_PORT=8082 para que coincida con el
      # listener del ALB. Replicamos lo mismo acá para que el comportamiento sea idéntico.
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-innovatech_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    ports:
      - "8082:8082"
    networks:
      - innovatech-net

  despachos:
    build:
      context: ./back-Despachos_SpringBoot
      dockerfile: ../Dockerfile
    container_name: innovatech-despachos
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_ENDPOINT: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-innovatech_db}
      DB_USERNAME: ${DB_USERNAME:-innovatech}
      DB_PASSWORD: ${DB_PASSWORD:-innovatech123}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-innovatech_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      # application.properties de Despachos ya trae server.port=8081, se mantiene igual.
    ports:
      - "8081:8081"
    networks:
      - innovatech-net

  frontend:
    build:
      context: ../innovatech-frontend
      dockerfile: Dockerfile
      args:
        # Como el build de Vite incrusta estas URLs en tiempo de compilación, deben apuntar
        # a los puertos publicados en el host (el navegador del usuario corre fuera de Docker).
        VITE_VENTAS_API_URL: http://localhost:8082
        VITE_DESPACHOS_API_URL: http://localhost:8081
    container_name: innovatech-frontend
    restart: unless-stopped
    depends_on:
      - ventas
      - despachos
    ports:
      - "80:80"
    networks:
      - innovatech-net

networks:
  innovatech-net:
    driver: bridge

volumes:
  mysql_data:
