- name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: innovatech-backend
        IMAGE_TAG: latest
      run: |
        # Buscamos la carpeta exacta de Ventas (respetando el typo 'SprignBoot')
        TARGET_DIR=$(find . -type d -name "back-Ventas_SprignBoot" | head -n 1)
        
        if [ -z "$TARGET_DIR" ]; then
          echo "ERROR: No se encontró la carpeta back-Ventas_SprignBoot"
          exit 1
        fi
        
        echo "Carpeta encontrada: $TARGET_DIR"
        cd "$TARGET_DIR"
        
        # Copiamos el Dockerfile desde la raíz usando la ruta absoluta de GitHub
        cp $GITHUB_WORKSPACE/Dockerfile .
        
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
