name: Deploy Ventas to ECS

on:
  push:
    branches: [ "deploy" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: innovatech-ventas
          IMAGE_TAG: latest
        run: |
          TARGET_DIR=$(find . -type d -iname "back-Ventas_SpringBoot" | head -n 1)
          if [ -z "$TARGET_DIR" ]; then
            echo "ERROR: No se encontro la carpeta back-Ventas_SpringBoot"
            ls -la
            exit 1
          fi
          DOCKERFILE_SRC=$(find . -maxdepth 1 -iname "dockerfile" | head -n 1)
          if [ -z "$DOCKERFILE_SRC" ]; then
            echo "ERROR: No se encontro Dockerfile en la raiz"
            ls -la
            exit 1
          fi
          cp "$DOCKERFILE_SRC" "$TARGET_DIR/Dockerfile"
          cd "$TARGET_DIR"
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Force new deployment on ECS
        run: |
          aws ecs update-service \
            --cluster innovatech-cluster \
            --service ventas-svc \
            --force-new-deployment \
            --region us-east-1

      - name: Wait for service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster innovatech-cluster \
            --services ventas-svc \
            --region us-east-1
