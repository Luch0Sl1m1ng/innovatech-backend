name: Deploy Backend to Amazon ECR

on:
  push:
    branches: [ "deploy" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        # CAMBIO CLAVE: El nombre exacto de tu repositorio en AWS
        ECR_REPOSITORY: innovatech-ventas
        IMAGE_TAG: latest
      run: |
        TARGET_DIR=$(find . -type d -name "back-Ventas_SpringBoot" | head -n 1)
        
        if [ -z "$TARGET_DIR" ]; then
          echo "ERROR: No se encontró la carpeta back-Ventas_SpringBoot"
          exit 1
        fi
        
        cd "$TARGET_DIR"
        cp "$GITHUB_WORKSPACE/Dockerfile" .
        
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set aws_session_token ${{ secrets.AWS_SESSION_TOKEN }}
          
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
          
          # Ajustamos el nombre aquí también
          docker pull ${{ steps.login-ecr.outputs.registry }}/innovatech-ventas:latest
          
          docker stop back-ventas || true
          docker rm back-ventas || true
          
          # Corriendo en el puerto 8081 para no chocar con el front
          docker run -d --name back-ventas -p 8081:8081 ${{ steps.login-ecr.outputs.registry }}/innovatech-ventas:latest
